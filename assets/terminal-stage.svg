<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
<title id="title">Deep Jade terminal studio</title>
<desc id="desc">A layered isometric terminal console with command output, code panels, and a three-dimensional desk platform.</desc>
<defs>
