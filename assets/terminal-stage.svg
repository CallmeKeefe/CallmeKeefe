<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
<title id="title">Keefe engineering terminal</title>
<desc id="desc">A restrained terminal window showing realistic version-control and test commands beside a short engineering note.</desc>
<rect width="1600" height="420" fill="#f1eee4"/>
<path d="M48 48H1552M48 372H1552" stroke="#aaa99a"/>
<text x="52" y="31" fill="#647369" font-family="monospace" font-size="12" letter-spacing="2">WORK NOTES / TERMINAL SESSION</text>
<g transform="translate(52 78)">
 <rect width="890" height="258" fill="#202b25" stroke="#26342c" stroke-width="1.5"/>
 <rect width="890" height="34" fill="#d9d7ca"/>
 <circle cx="18" cy="17" r="4" fill="#9d4a3d"/><circle cx="34" cy="17" r="4" fill="#b28a4e"/><circle cx="50" cy="17" r="4" fill="#68836d"/>
 <text x="72" y="21" fill="#4f5c53" font-family="monospace" font-size="11">keefe@workstation: ~/projects</text>
 <g font-family="monospace" font-size="16">
  <text x="26" y="76" fill="#b6c8b8">$ git status --short</text>
  <text x="26" y="103" fill="#e8e5d9"> M README.md</text>
  <text x="26" y="130" fill="#e8e5d9">?? tests/edge-cases.md</text>
  <text x="26" y="171" fill="#b6c8b8">$ pytest -q</text>
  <text x="26" y="198" fill="#e8e5d9">..............................</text>
  <text x="26" y="225" fill="#9bb99e">30 passed</text>
  <rect x="130" y="212" width="9" height="17" fill="#c17a60"/>
 </g>
</g>
<g transform="translate(1010 100)">
 <text x="0" y="0" fill="#647369" font-family="monospace" font-size="12" letter-spacing="2">ENGINEERING HABIT</text>
 <text x="0" y="58" fill="#26342c" font-family="Arial,sans-serif" font-size="34" font-weight="700">Make the change.</text>
 <text x="0" y="101" fill="#26342c" font-family="Arial,sans-serif" font-size="34" font-weight="700">Check the evidence.</text>
 <path d="M0 128H480" stroke="#aaa99a"/>
 <text x="0" y="166" fill="#647369" font-family="Arial,sans-serif" font-size="17">A clean diff is a start.</text>
 <text x="0" y="193" fill="#647369" font-family="Arial,sans-serif" font-size="17">A tested result is better.</text>
 <text x="0" y="220" fill="#647369" font-family="Arial,sans-serif" font-size="17">Document what remains unknown.</text>
</g>
<text x="52" y="400" fill="#647369" font-family="monospace" font-size="11" letter-spacing="1.5">COMMANDS SHOWN AS AN ILLUSTRATIVE WORKFLOW, NOT A LIVE SYSTEM STATUS.</text>
</svg>