<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
  <title id="title">Steven Keefe — terminal and strategy boards</title>
  <desc id="desc">A refined dark terminal interface with dimensional lettering, a correctly arranged Xiangqi starting position, and a standard Western chess starting position.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1211"/>
      <stop offset=".52" stop-color="#14221d"/>
      <stop offset="1" stop-color="#1c3028"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24372f"/>
      <stop offset="1" stop-color="#101b17"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0c7"/>
      <stop offset=".48" stop-color="#d7b77b"/>
      <stop offset="1" stop-color="#98734a"/>
    </linearGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8d4bd"/>
      <stop offset="1" stop-color="#638c76"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d6a5"/>
      <stop offset="1" stop-color="#b98754"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset="1" stop-color="#cbd6c9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textShadow" x="-30%" y="-50%" width="160%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope=".8"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="noise" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".45" fill="#fff" opacity=".12"/>
    </pattern>
    <clipPath id="clip"><rect width="1400" height="470" rx="24"/></clipPath>
    <g id="blackPiece">
      <circle r="15" fill="#17231e" stroke="#d6b77d" stroke-width="2.1"/>
      <circle r="11.4" fill="none" stroke="#d6b77d" stroke-opacity=".52"/>
    </g>
    <g id="redPiece">
      <circle r="15" fill="#f0dfbd" stroke="#a64e3e" stroke-width="2.1"/>
      <circle r="11.4" fill="none" stroke="#a64e3e" stroke-opacity=".6"/>
    </g>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1400" height="470" fill="url(#bg)"/>
    <rect width="1400" height="470" fill="url(#noise)" opacity=".18"/>
    <path d="M0 390C260 330 360 470 670 400S1120 340 1400 390V470H0Z" fill="#2b493b" opacity=".34"/>
    <path d="M35 36H1365M35 434H1365" stroke="#b5cbb8" stroke-opacity=".15"/>
    <circle cx="1290" cy="74" r="110" fill="#8ea991" opacity=".035"/>
    <circle cx="100" cy="390" r="150" fill="#c28a60" opacity=".035"/>

    <!-- Terminal slab -->
    <g filter="url(#shadow)" transform="translate(54 72)">
      <path d="M14 20L34 0H604L624 20V346L604 366H14L0 352V34Z" fill="#07100d" stroke="#718d7c" stroke-opacity=".65" stroke-width="2"/>
      <path d="M14 20L34 0H604L624 20V48H0V34Z" fill="#2a4036"/>
      <path d="M0 48H624" stroke="#8ba893" stroke-opacity=".35"/>
      <circle cx="25" cy="25" r="5" fill="#c77c62"/>
      <circle cx="44" cy="25" r="5" fill="#d7b77b"/>
      <circle cx="63" cy="25" r="5" fill="#8fb69a"/>
      <text x="90" y="30" fill="#b7cbb9" font-family="monospace" font-size="12" letter-spacing="2">KEEFE SHELL / SESSION 001</text>
      <text x="34" y="111" fill="#617b6a" font-family="monospace" font-size="12" letter-spacing="3">INDEPENDENT DEVELOPER</text>
      <text x="30" y="166" fill="#594a36" font-family="Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="1" filter="url(#textShadow)">STEVEN KEEFE</text>
      <text x="30" y="160" fill="url(#gold)" font-family="Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="1">STEVEN KEEFE</text>
      <path d="M32 184H578" stroke="#b7cbb9" stroke-opacity=".25"/>
      <text x="34" y="224" fill="#9ac5a5" font-family="monospace" font-size="17">$</text>
      <text x="58" y="224" fill="#e1e8dc" font-family="monospace" font-size="17">build</text>
      <text x="113" y="224" fill="#d7b77b" font-family="monospace" font-size="17">·</text>
      <text x="130" y="224" fill="#e1e8dc" font-family="monospace" font-size="17">test</text>
      <text x="174" y="224" fill="#d7b77b" font-family="monospace" font-size="17">·</text>
      <text x="191" y="224" fill="#e1e8dc" font-family="monospace" font-size="17">understand</text>
      <rect x="34" y="255" width="9" height="19" rx="1" fill="#c77c62"/>
      <text x="58" y="270" fill="#718f7b" font-family="monospace" font-size="13">AI SYSTEMS / SOFTWARE / OPEN SOURCE</text>
      <path d="M34 310H578" stroke="#b7cbb9" stroke-opacity=".13"/>
      <text x="34" y="335" fill="#7e9c87" font-family="monospace" font-size="11">STATUS: LEARNING IN PUBLIC</text>
    </g>

    <!-- Xiangqi board: 9 files, 10 ranks, river gap, palaces, correct initial setup -->
    <g transform="translate(730 76)">
      <rect x="-20" y="-18" width="350" height="360" rx="15" fill="url(#panel)" stroke="#829b88" stroke-opacity=".45" filter="url(#shadow)"/>
      <text x="155" y="8" fill="#d7b77b" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="2">XIANGQI / 象棋</text>
      <rect x="0" y="28" width="310" height="270" rx="4" fill="url(#wood)" stroke="#e7c99a" stroke-width="2"/>
      <g stroke="#694b31" stroke-width="1.5" fill="none">
        <path d="M15 42V150M15 176V284M50 42V150M50 176V284M85 42V150M85 176V284M120 42V150M120 176V284M155 42V150M155 176V284M190 42V150M190 176V284M225 42V150M225 176V284M260 42V150M260 176V284M295 42V150M295 176V284"/>
        <path d="M15 42H295M15 69H295M15 96H295M15 123H295M15 150H295M15 176H295M15 203H295M15 230H295M15 257H295M15 284H295"/>
        <path d="M120 42L190 96M190 42L120 96M120 230L190 284M190 230L120 284" stroke-width="1.4"/>
      </g>
      <path d="M15 150H295" stroke="#694b31" stroke-width="1.2" stroke-dasharray="4 4" opacity=".45"/>
      <rect x="15" y="150" width="280" height="26" fill="#c79a64" opacity=".38"/>
      <text x="155" y="167" text-anchor="middle" fill="#765437" font-family="Noto Serif CJK SC, Noto Serif CJK TC, Songti SC, SimSun, serif" font-size="12" letter-spacing="7">楚 河   漢 界</text>
      <!-- Black back rank -->
      <g transform="translate(15 42)">
        <use href="#blackPiece" x="0"/><use href="#blackPiece" x="35"/><use href="#blackPiece" x="70"/><use href="#blackPiece" x="105"/><use href="#blackPiece" x="140"/><use href="#blackPiece" x="175"/><use href="#blackPiece" x="210"/><use href="#blackPiece" x="245"/><use href="#blackPiece" x="280"/>
        <g fill="#f1dfbd" font-family="Noto Serif CJK SC, Noto Serif CJK TC, Songti SC, SimSun, serif" font-size="15" font-weight="700" text-anchor="middle">
          <text x="0" y="5">車</text><text x="35" y="5">馬</text><text x="70" y="5">象</text><text x="105" y="5">士</text><text x="140" y="5">將</text><text x="175" y="5">士</text><text x="210" y="5">象</text><text x="245" y="5">馬</text><text x="280" y="5">車</text>
        </g>
      </g>
      <!-- Black cannons and soldiers -->
      <g transform="translate(15 96)">
        <use href="#blackPiece" x="35"/><use href="#blackPiece" x="245"/>
        <g fill="#f1dfbd" font-family="Noto Serif CJK SC, Noto Serif CJK TC, Songti SC, SimSun, serif" font-size="15" font-weight="700" text-anchor="middle"><text x="35" y="5">砲</text><text x="245" y="5">砲</text></g>
      </g>
      <g transform="translate(15 123)">
        <use href="#blackPiece" x="0"/><use href="#blackPiece" x="70"/><use href="#blackPiece" x="140"/><use href="#blackPiece" x="210"/><use href="#blackPiece" x="280"/>
        <g fill="#f1dfbd" font-family="Noto Serif CJK SC, Noto Serif CJK TC, Songti SC, SimSun, serif" font-size="15" font-weight="700" text-anchor="middle"><text x="0" y="5">卒</text><text x="70" y="5">卒</text><text x="140" y="5">卒</text><text x="210" y="5">卒</text><text x="280" y="5">卒</text></g>
      </g>
      <!-- Red soldiers, cannons and back rank -->
      <g transform="translate(15 203)">
        <use href="#redPiece" x="0"/><use href="#redPiece" x="70"/><use href="#redPiece" x="140"/><use href="#redPiece" x="210"/><use href="#redPiece" x="280"/>
        <g fill="#8f3f35" font-family="Noto Serif CJK SC, Noto Serif CJK TC, Songti SC, SimSun, serif" font-size="15" font-weight="700" text-anchor="middle"><text x="0" y="5">兵</text><text x="70" y="5">兵</text><text x="140" y="5">兵</text><text x="210" y="5">兵</text><text x="280" y="5">兵</text></g>
      </g>
      <g transform="translate(15 230)">
        <use href="#redPiece" x="35"/><use href="#redPiece" x="245"/>
        <g fill="#8f3f35" font-family="Noto Serif CJK SC, Noto Serif CJK TC, Songti SC, SimSun, serif" font-size="15" font-weight="700" text-anchor="middle"><text x="35" y="5">炮</text><text x="245" y="5">炮</text></g>
      </g>
      <g transform="translate(15 284)">
        <use href="#redPiece" x="0"/><use href="#redPiece" x="35"/><use href="#redPiece" x="70"/><use href="#redPiece" x="105"/><use href="#redPiece" x="140"/><use href="#redPiece" x="175"/><use href="#redPiece" x="210"/><use href="#redPiece" x="245"/><use href="#redPiece" x="280"/>
        <g fill="#8f3f35" font-family="Noto Serif CJK SC, Noto Serif CJK TC, Songti SC, SimSun, serif" font-size="15" font-weight="700" text-anchor="middle"><text x="0" y="5">俥</text><text x="35" y="5">傌</text><text x="70" y="5">相</text><text x="105" y="5">仕</text><text x="140" y="5">帥</text><text x="175" y="5">仕</text><text x="210" y="5">相</text><text x="245" y="5">傌</text><text x="280" y="5">俥</text></g>
      </g>
      <text x="155" y="326" text-anchor="middle" fill="#b9cbbb" font-family="monospace" font-size="10" letter-spacing="1.4">9 FILES · 10 RANKS · RIVER & PALACES</text>
    </g>

    <!-- Western chess board, standard initial position -->
    <g transform="translate(1100 110)">
      <rect x="-15" y="-18" width="250" height="250" rx="13" fill="url(#panel)" stroke="#829b88" stroke-opacity=".45" filter="url(#shadow)"/>
      <text x="110" y="4" fill="#d7b77b" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="2">CHESS / ♟</text>
      <rect x="12" y="22" width="196" height="196" fill="#d9c7a6" stroke="#9c805d" stroke-width="2"/>
      <g>
        <path d="M12 22H36.5V46.5H12ZM61 22H85.5V46.5H61ZM110 22H134.5V46.5H110ZM159 22H183.5V46.5H159ZM36.5 46.5H61V71H36.5ZM85.5 46.5H110V71H85.5ZM134.5 46.5H159V71H134.5ZM183.5 46.5H208V71H183.5ZM12 71H36.5V95.5H12ZM61 71H85.5V95.5H61ZM110 71H134.5V95.5H110ZM159 71H183.5V95.5H159ZM36.5 95.5H61V120H36.5ZM85.5 95.5H110V120H85.5ZM134.5 95.5H159V120H134.5ZM183.5 95.5H208V120H183.5ZM12 120H36.5V144.5H12ZM61 120H85.5V144.5H61ZM110 120H134.5V144.5H110ZM159 120H183.5V144.5H159ZM36.5 144.5H61V169H36.5ZM85.5 144.5H110V169H85.5ZM134.5 144.5H159V169H134.5ZM183.5 144.5H208V169H183.5ZM12 169H36.5V193.5H12ZM61 169H85.5V193.5H61ZM110 169H134.5V193.5H110ZM159 169H183.5V193.5H159ZM36.5 193.5H61V218H36.5ZM85.5 193.5H110V218H85.5ZM134.5 193.5H159V218H134.5ZM183.5 193.5H208V218H183.5Z" fill="#33483b"/>
      </g>
      <g font-family="DejaVu Sans, Noto Sans Symbols 2, Segoe UI Symbol, Apple Symbols, serif" text-anchor="middle" dominant-baseline="central">
        <g fill="#25382d" stroke="#f3dfb8" stroke-width="1.4" paint-order="stroke" font-size="21">
          <text x="24.25" y="34">♜</text><text x="48.75" y="34">♞</text><text x="73.25" y="34">♝</text><text x="97.75" y="34">♛</text><text x="122.25" y="34">♚</text><text x="146.75" y="34">♝</text><text x="171.25" y="34">♞</text><text x="195.75" y="34">♜</text>
          <text x="24.25" y="58.5">♟</text><text x="48.75" y="58.5">♟</text><text x="73.25" y="58.5">♟</text><text x="97.75" y="58.5">♟</text><text x="122.25" y="58.5">♟</text><text x="146.75" y="58.5">♟</text><text x="171.25" y="58.5">♟</text><text x="195.75" y="58.5">♟</text>
        </g>
        <g fill="#fffdf3" stroke="#24342b" stroke-width="1.2" paint-order="stroke" font-size="21">
          <text x="24.25" y="181.25">♙</text><text x="48.75" y="181.25">♙</text><text x="73.25" y="181.25">♙</text><text x="97.75" y="181.25">♙</text><text x="122.25" y="181.25">♙</text><text x="146.75" y="181.25">♙</text><text x="171.25" y="181.25">♙</text><text x="195.75" y="181.25">♙</text>
          <text x="24.25" y="205.75">♖</text><text x="48.75" y="205.75">♘</text><text x="73.25" y="205.75">♗</text><text x="97.75" y="205.75">♕</text><text x="122.25" y="205.75">♔</text><text x="146.75" y="205.75">♗</text><text x="171.25" y="205.75">♘</text><text x="195.75" y="205.75">♖</text>
        </g>
      </g>
      <text x="110" y="250" text-anchor="middle" fill="#b9cbbb" font-family="monospace" font-size="10" letter-spacing="1.2">STANDARD START POSITION</text>
    </g>
  </g>
</svg>