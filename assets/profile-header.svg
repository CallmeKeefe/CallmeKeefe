    <path d="M28 112L164 28M164 28L300 112M28 140L164 222M164 222L300 140" stroke="#d98b68" stroke-opacity=".5"/>
  </g>
  <g fill="#172523" stroke="#a7d7bf" stroke-width="2">
    <circle cx="62" cy="56" r="15"/><circle cx="164" cy="56" r="15"/><circle cx="266" cy="56" r="15"/>
    <circle cx="96" cy="168" r="15"/><circle cx="232" cy="168" r="15"/>
  </g>
  <g fill="#f0f0e8" font-family="Georgia,serif" font-size="17" text-anchor="middle">
    <text x="62" y="62">車</text><text x="164" y="62">將</text><text x="266" y="62">馬</text><text x="96" y="174">炮</text><text x="232" y="174">卒</text>
  </g>
